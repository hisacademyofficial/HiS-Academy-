p<!DOCTYPE html>
<html>
<head>
  <title>Live Class - HIS Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Poppins, sans-serif;
      background:linear-gradient(135deg,#0f0f1a,#1a1a2e);
      color:white;
      padding-bottom: 80px;
    }

    .header{
      background:#111827;
      padding:15px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
      color:#FFD700;
      box-shadow:0 0 20px rgba(255,215,0,0.2);
    }

    .container{
      padding:15px;
      max-width:1000px;
      margin:auto;
    }

    .card{
      background:#111827;
      border-radius:15px;
      padding:25px;
      margin-bottom:20px;
      box-shadow:0 0 25px rgba(255,215,0,0.15);
      text-align:center;
    }

    .live-badge{
      display:inline-block;
      background:red;
      padding:6px 12px;
      border-radius:20px;
      font-size:14px;
      margin-left:10px;
      animation:pulse 1s infinite;
    }

    @keyframes pulse{
      0%{opacity:1;}
      50%{opacity:0.5;}
      100%{opacity:1;}
    }

    .title{
      font-size:20px;
      font-weight:bold;
      color:#FFD700;
      margin-bottom:10px;
    }

    .desc{
      font-size:14px;
      opacity:0.8;
      margin-bottom:20px;
    }

    .join-btn{
      background:#25D366;
      color:white;
      padding:14px;
      width:100%;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .join-btn:hover{
      background:#1ebc57;
    }

    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      height:65px;
      background:#111827;
      display:flex;
      justify-content:space-around;
      align-items:center;
      box-shadow:0 -5px 20px rgba(255,215,0,0.1);
      z-index:1000;
    }

    .nav-item{
      text-align:center;
      font-size:12px;
      cursor:pointer;
      color:#aaa;
    }

    .nav-item span{
      display:block;
      font-size:20px;
    }

    .nav-item.active{
      color:#FFD700;
    }

  </style>
</head>
<body>

<div class="header">
  H I S Academy 
  <span class="live-badge">🔴 LIVE STARTED</span>
</div>

<div class="container">

  <div class="card">

    <div class="title">
      SSLC 2026 – 90+ Strategy Masterclass
    </div>

    <div class="desc">
      Mentor: Manjunath Sir | Target: 90+ Marks  
      Click below to join the live class.
    </div>

    <!-- 🔥 PASTE YOUR LIVE LINK BELOW -->
    <button class="join-btn" onclick="joinLive()">
      🚀 Join Now
    </button>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "his-academy.firebaseapp.com",
  projectId: "his-academy"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let liveLink = "";

// Fetch live link from Firestore
db.collection("settings").doc("live").get().then((doc)=>{
    if(doc.exists){
        liveLink = doc.data().link;
    }
});

function joinLive(){
    if(liveLink){
        window.open(liveLink, "_blank");
    } else {
        alert("Live link not updated yet!");
    }
}

/* Bottom Navigation */
function goDashboard(){ window.location.href="dashboard.html"; }
function goLive(){ window.location.href="live.html"; }
function goRecorded(){ window.location.href="recorded.html"; }
function goNotes(){ window.location.href="notes.html"; }
function goProfile(){ window.location.href="profile.html"; }

</script>
<div class="bottom-nav">

  <div class="nav-item" onclick="goDashboard()">
    <span>🏠</span>
    Dashboard
  </div>

  <div class="nav-item active" onclick="goLive()">
    <span>🔴</span>
    Live
  </div>

  <div class="nav-item" onclick="goNotes()">
    <span>📄</span>
    Notes
  </div>

  <div class="nav-item" onclick="goRecorded()">
    <span>🎥</span>
    Recorded
  </div>

  <div class="nav-item" onclick="goProfile()">
    <span>👤</span>
    Profile
  </div>

</div>

</body>
</html>
